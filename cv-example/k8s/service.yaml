apiVersion: v1
kind: Service
metadata:
  name: my-app-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"         # The port your app exposes metrics on
    prometheus.io/path: "/metrics"   # The endpoint path (defaults to /metrics)
spec:
  selector:
    app: cv-demo-app
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
